server {
    listen 80;
    server_name 192.168.0.221;

    # SPA routing — serve index.html for all non-file routes
    location / {
        root /home/tech-admin/treppides-hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /docs/ {
        proxy_pass         http://127.0.0.1:6875/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
        proxy_buffering        on;
        proxy_buffer_size      16k;
        proxy_buffers          8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ClickUp Fees API — Python backend on port 8001
    location /api/clickup/ {
        proxy_pass         http://127.0.0.1:8001/api/clickup/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout  10s;
        proxy_read_timeout     30s;
    }

    # OpenProject — Project Management on port 3000
    location /projects {
        proxy_pass         http://127.0.0.1:3000/projects;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }
}
