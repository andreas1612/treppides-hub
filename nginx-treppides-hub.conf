# ============================================================
# nginx-treppides-hub.conf
#
# Subdomain : hub.treppides.com  (internal LAN only)
# Server IP : 192.168.0.221
# HTTPS     : Sectigo wildcard *.treppides.com
#             Cert chain : /etc/nginx/ssl/treppides_chain.crt
#             Private key: /etc/nginx/ssl/treppides.key
#
# DNS requirement (internal only):
#   Internal DNS must resolve hub.treppides.com → 192.168.0.221
#   No public DNS record needed while LAN-only.
#
# Deploy:
#   sudo cp nginx-treppides-hub.conf /etc/nginx/sites-enabled/treppides-hub
#   sudo nginx -t && sudo systemctl reload nginx
#
# Hardened: 2026-06-02 — DDoS prevention, rate limiting,
#   connection caps, slow-client protection, video streaming,
#   gzip, upstream keepalive, CSP, TLS hardening.
#
# Reconciled with live server 2026-09-02 — this file had drifted from
# production (hand-edited directly, same pattern as other services in this
# repo); pulled the live config back here rather than overwrite it blind.
# ============================================================

# ---- Upstream pools with keepalive --------------------------------
upstream clickup_backend {
    server 127.0.0.1:8001;
    keepalive 8;
}

upstream valuation_backend {
    server 127.0.0.1:8002;
    keepalive 8;
}

upstream companies_backend {
    server 127.0.0.1:8003;
    keepalive 8;
}

upstream bookstack_backend {
    server 127.0.0.1:6875;
    keepalive 4;
}


upstream roombooking_backend {
    server 127.0.0.1:8090;
    keepalive 4;
}

upstream kyc_backend {
    server 127.0.0.1:8091;
    keepalive 4;
}

upstream wisebos_backend {
    server 127.0.0.1:8095;
    keepalive 4;
}

upstream taskmanager_backend {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream teamcalendar_backend {
    server 127.0.0.1:8004;
    keepalive 4;
}

upstream newsletter_backend {
    server 127.0.0.1:8005;
    keepalive 4;
}

# ---- Redirect bare IP and HTTP → HTTPS ---------------------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://hub.treppides.com$request_uri;
}

# ---- HTTPS — main site -------------------------------------
server {
    listen 443 ssl http2;
    server_name hub.treppides.com;

    # --- SSL certificates ---
    ssl_certificate     /etc/nginx/ssl/treppides_chain.crt;
    ssl_certificate_key /etc/nginx/ssl/treppides.key;

    # --- TLS hardening (TLS 1.2+ only, strong ciphers) ---
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --- OCSP Stapling ---
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout          5s;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header Referrer-Policy           strict-origin-when-cross-origin        always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; font-src 'self'; object-src 'self' blob:; base-uri 'self'; form-action 'self';" always;

    # --- Hide nginx version ---
    server_tokens off;

    # --- DDoS / slow-client protection ---
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     65s;
    keepalive_requests    200;

    # --- Default body limit (overridden per-location where needed) ---
    client_max_body_size 1m;

    # =================================================================
    # STATIC ASSETS — SPA routing
    # =================================================================
    location / {
        root /home/tech-admin/treppides-hub;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets — CSS/JS 1 day, vendor 7 days
        location ~* \.(css|js)$ {
            expires 1d;
            add_header Cache-Control "public, must-revalidate";
        }
        location /vendor/ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # =================================================================
    # MEDIA — images, videos, training videos (static serve)
    # Supports byte-range requests for video seeking (Accept-Ranges)
    # =================================================================
    location /media/ {
        alias /home/tech-admin/treppides-hub/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges bytes;

        # Block executable scripts
        location ~* \.(php|py|sh|pl|rb)$ {
            deny all;
        }

        # Video streaming — optimised for training platform (5+ min videos)
        location ~* \.(mp4|webm|mov)$ {
            # mp4 pseudo-streaming: allows seeking without downloading entire file
            mp4;
            mp4_buffer_size     1m;
            mp4_max_buffer_size 10m;

            # Efficient file I/O
            sendfile    on;
            tcp_nopush  on;
            tcp_nodelay on;
            directio    1m;
            output_buffers 2 1m;

            # Long timeout — user may pause for minutes then resume
            send_timeout 300s;

            # Allow range requests (seeking) — already inherited but explicit
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=604800, immutable";
            expires 7d;
        }
    }

    # =================================================================
    # BOOKSTACK — Knowledge Base (Docker on port 6875)
    # =================================================================
    location /docs/ {
        proxy_pass              http://bookstack_backend/;
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_connect_timeout   10s;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
        proxy_buffering         on;
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        limit_req zone=api burst=30 nodelay;
    }

    # BookStack API proxy — token injected server-side (never sent to browser)
    location /api/kb/ {
        auth_request          /_auth;
        auth_request_set      $auth_status $upstream_status;
        proxy_pass            http://bookstack_backend/api/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      Authorization     "Token YZHSc8cG5R2T2SpKWY2EMMr57NnzMB82:Shpnd4Brq1S2T0mX9tXOSOPnFIYTuSmG";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req  zone=api burst=30 nodelay;
        limit_conn addr 20;
    }

    # BookStack attachment proxy — token injected server-side
    location /api/kb-attach/ {
        auth_request          /_auth;
        auth_request_set      $auth_status $upstream_status;
        proxy_pass            http://bookstack_backend/attachments/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      Authorization     "Token YZHSc8cG5R2T2SpKWY2EMMr57NnzMB82:Shpnd4Brq1S2T0mX9tXOSOPnFIYTuSmG";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }

    # =================================================================
    # INTERNAL AUTH CHECK — validate Azure AD session via Task Manager
    # 200 → allow; 401/403 → deny.
    # =================================================================
    location = /_auth {
        internal;
        proxy_pass              http://taskmanager_backend/api/me;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host   $host;
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        X-Requested-With XMLHttpRequest;
    }

    # =================================================================
    # MEDIA UPLOAD API — FastAPI (port 8001)
    # Stricter rate limit + larger body for uploads
    # =================================================================
    location /api/upload/ {
        auth_request     /_auth;
        auth_request_set $auth_status $upstream_status;

        proxy_pass            http://clickup_backend/api/upload/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Large body for video uploads (150 MB + overhead)
        client_max_body_size    160m;
        client_body_buffer_size 256k;
        client_body_temp_path   /tmp/nginx_upload;

        # Rate limit: 5 uploads per minute per IP
        limit_req  zone=upload burst=3 nodelay;
        limit_conn addr 5;
    }

    # =================================================================
    # CLICKUP FEES API — Python FastAPI (port 8001)
    # =================================================================
    location /api/clickup/ {
        auth_request     /_auth;
        auth_request_set $auth_status $upstream_status;

        proxy_pass            http://clickup_backend/api/clickup/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }

    # =================================================================
    # VALUATION REFERENCE API — Python FastAPI (port 8002)
    # =================================================================
    location /api/valuation/ {
        auth_request     /_auth;
        auth_request_set $auth_status $upstream_status;

        proxy_pass            http://valuation_backend/api/valuation/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }

    # =================================================================
    # COMPANY FINDER API — Python FastAPI (port 8003)
    # =================================================================
    location /api/companies/ {
        auth_request     /_auth;
        auth_request_set $auth_status $upstream_status;

        proxy_pass            http://companies_backend/api/companies/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        # A manual full refresh (?wait=true&full=true) re-fetches all spaces and
        # can take a couple of minutes — allow for it.
        proxy_read_timeout    300s;

        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }



    # =================================================================
    # STAFF DIRECTORY API - Python FastAPI (port 8010)
    # =================================================================
    location /api/staffdir/ {
        auth_request          /_auth;
        auth_request_set      $auth_status $upstream_status;
        proxy_pass            http://staff_backend/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }

    # =================================================================
    # TEAM CALENDAR API — Python FastAPI (port 8004)
    # =================================================================
    location /api/teamcal/ {
        auth_request          /_auth;
        auth_request_set      $auth_status $upstream_status;
        auth_request_set      $auth_user $upstream_http_x_auth_user;
        proxy_pass            http://teamcalendar_backend/api/teamcal/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      X-User-Email      $auth_user;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }

    # =================================================================
    # NEWSLETTER INTELLIGENCE API — Python FastAPI (port 8005)
    # =================================================================
    location /api/newsletter/ {
        auth_request          /_auth;
        auth_request_set      $auth_status $upstream_status;
        proxy_pass            http://newsletter_backend/api/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }

    # =================================================================
    # TASK MANAGER — proxy to Spring Boot (port 8080)
    # =================================================================
    location /projects/ {
        proxy_pass            http://taskmanager_backend/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        limit_req  zone=api burst=20 nodelay;
        limit_conn addr 20;
    }

    location /oauth2/ {
        proxy_pass            http://taskmanager_backend/oauth2/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
    }
    location /login/oauth2/ {
        proxy_pass            http://taskmanager_backend/login/oauth2/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
    }

    # =================================================================
    # ROOM BOOKING — Python FastAPI (port 8090)
    # =================================================================
    location /rooms/ {
        proxy_pass            http://roombooking_backend/rooms/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req  zone=api burst=20 nodelay;
    }

    # =================================================================
    # KYC MANAGEMENT — Python FastAPI (port 8091)
    # =================================================================
    location /kyc/ {
        auth_request          /_auth;
        auth_request_set      $auth_status $upstream_status;
        proxy_pass            http://kyc_backend/kyc/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req  zone=api burst=20 nodelay;
    }

    # =================================================================
    # Catch-all: deny access to hidden files (except .well-known)
    # =================================================================
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# =================================================================
# WISEBOS-NEXT — internal tool, FULL/SUPER tier only (2026-09-02)
#
# Own port (not a path under the main 443 server) because WiseBOS is a
# single-page app using root-absolute paths (/api/me, /api/document/...,
# /viz/...) baked into its HTML — proxying it under a URL prefix like
# /wisebos/ would send those requests to hub.treppides.com's OWN /api/me
# etc. instead, silently breaking it. Same hub.treppides.com cert works
# on any port, so this needs no new DNS entry.
#
# Auth: gated by /api/me/gate/full (TaskManager, RoleService.isFull()) —
# reuses the existing hub Azure AD session, no separate WiseBOS login.
# WiseBOS's own username/password auth (WISEBOS_AUTH) has been turned off
# on this box and it's bound to 127.0.0.1 only — this nginx gate is now
# the only way in. Redirect entry point is the hub sidebar (config.js
# WISEBOS_URL), not embedded — plain browser navigation to this port.
# =================================================================
server {
    listen 8888 ssl http2;
    server_name hub.treppides.com;

    ssl_certificate     /etc/nginx/ssl/treppides_chain.crt;
    ssl_certificate_key /etc/nginx/ssl/treppides.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options        SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff   always;
    server_tokens off;

    location = /_auth_full {
        internal;
        proxy_pass              http://taskmanager_backend/api/me/gate/full;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host   $host;
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        X-Requested-With XMLHttpRequest;
    }

    location / {
        auth_request     /_auth_full;

        proxy_pass            http://wisebos_backend/;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
