# ============================================================
# nginx-treppides-hub.conf
#
# Subdomain : hub.treppides.com  (internal LAN only)
# Server IP : 192.168.0.221
# HTTPS     : Sectigo wildcard *.treppides.com
#             Cert chain : /etc/nginx/ssl/treppides_chain.crt
#             Private key: /etc/nginx/ssl/treppides.key
#
# DNS requirement (internal only):
#   Internal DNS must resolve hub.treppides.com → 192.168.0.221
#   No public DNS record needed while LAN-only.
#
# Deploy:
#   sudo cp nginx-treppides-hub.conf /etc/nginx/sites-enabled/treppides-hub
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---- Redirect bare IP and HTTP → HTTPS ---------------------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://hub.treppides.com$request_uri;
}

# ---- HTTPS — main site -------------------------------------
server {
    listen 443 ssl;
    server_name hub.treppides.com;

    # --- SSL certificates ---
    ssl_certificate     /etc/nginx/ssl/treppides_chain.crt;
    ssl_certificate_key /etc/nginx/ssl/treppides.key;

    # --- SSL hardening ---
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5:!RC4:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           SAMEORIGIN          always;
    add_header X-Content-Type-Options    nosniff             always;
    add_header Referrer-Policy           no-referrer         always;

    # --- Upload size limit (video uploads up to 150 MB) ---
    client_max_body_size 160m;

    # --- SPA routing — serve index.html for all non-file routes ---
    location / {
        root /home/tech-admin/treppides-hub;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- BookStack — Knowledge Base (Docker on port 6875) ---
    location /docs/ {
        proxy_pass              http://127.0.0.1:6875/;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_connect_timeout   10s;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
        proxy_buffering         on;
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # --- Media uploads — images and videos served as static files ---
    location /media/ {
        alias /home/tech-admin/treppides-hub/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges bytes;
        location ~* \.(php|py|sh|pl|rb)$ {
            deny all;
        }
    }

    # --- Media upload API — FastAPI (port 8001) ---
    location /api/upload/ {
        proxy_pass            http://127.0.0.1:8001/api/upload/;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        client_max_body_size  160m;
    }

    # --- ClickUp Fees API — Python FastAPI (port 8001) ---
    location /api/clickup/ {
        proxy_pass            http://127.0.0.1:8001/api/clickup/;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # --- Valuation Reference API — Python FastAPI (port 8002) ---
    location /api/valuation/ {
        proxy_pass            http://127.0.0.1:8002/api/valuation/;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # --- OpenProject — Project Management (port 3000) ---
    location /projects {
        proxy_pass            http://127.0.0.1:3000/projects;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
