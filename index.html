<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Treppides Hub – Internal Portal</title>

  <!-- CSS load order: variables first, then base, layout, components -->
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/cards.css" />
  <link rel="stylesheet" href="styles/modals.css" />
  <link rel="stylesheet" href="styles/pages/reader.css" />
  <link rel="stylesheet" href="styles/pages/fees.css" />
  <link rel="stylesheet" href="styles/pages/staff.css?v=live1" />
  <link rel="stylesheet" href="styles/pages/aml.css" />
  <link rel="stylesheet" href="styles/pages/knowledgebase.css" />
  <link rel="stylesheet" href="styles/pages/valuation.css" />
  <link rel="stylesheet" href="styles/pages/valuation-tour.css" />
  <link rel="stylesheet" href="styles/pages/companies.css" />
  <link rel="stylesheet" href="styles/pages/crm.css" />
  <link rel="stylesheet" href="styles/pages/crm-list.css" />
  <link rel="stylesheet" href="styles/pages/performance.css" />
  <link rel="stylesheet" href="styles/pages/manager-kpi.css" />
  <link rel="stylesheet" href="styles/pages/tbratio.css" />
  <link rel="stylesheet" href="styles/pages/tbratio-tour.css" />
  <link rel="stylesheet" href="styles/pages/forms.css" />
  <link rel="stylesheet" href="styles/pages/financials.css" />
  <link rel="stylesheet" href="styles/pages/team-calendar.css" />
  <link rel="stylesheet" href="styles/widgets/announcements.css" />
  <link rel="stylesheet" href="styles/widgets/newsletter.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

  <!-- ============================================================
       Mobile top bar + nav drawer
       Populated by: components/sidebar.js → #mobile-header
       ============================================================ -->
  <div id="mobile-header"></div>

  <!-- ============================================================
       App shell — sidebar + main content
       ============================================================ -->
  <div class="app-shell">

    <!-- Sidebar mount point
         Populated by: components/sidebar.js -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main content area -->
    <main class="main">

      <!-- Top header bar mount point
           Populated by: components/topbar.js -->
      <header class="topbar" id="topbar"></header>

      <!-- Reader overlay — populated by components/reader.js -->
      <div id="hub-content-area" class="reader-overlay"></div>

      <!-- Page body -->
      <div class="page-content">

        <!-- Latest Announcements section
             Populated by: components/announcements.js -->
        <div id="section-announcements"></div>

        <!-- Regulatory & Industry Intelligence feed
             Populated by: components/widgets/newsletter.js -->
        <div id="section-newsletter"></div>

        <!-- Quick Access widget row
             Populated by: components/quicklinks.js -->
        <div id="section-quicklinks"></div>

      </div><!-- /page-content -->

      <!-- Projects — dedicated page view (under development)
           Lives OUTSIDE .page-content so it can be toggled independently.
           Populated by: components/projects.js -->
      <div id="section-projects"></div>

      <!-- Knowledge Base — dedicated page view
           Lives OUTSIDE .page-content so it can be toggled independently.
           Populated by: components/knowledgebase.js -->
      <div id="section-kb"></div>

      <!-- Staff Directory — dedicated page view
           Lives OUTSIDE .page-content so it can be toggled independently.
           Populated by: components/staff.js -->
      <div id="section-staff"></div>

      <!-- AML Dashboard landing — dedicated page view
           Three cards (New / Rejected / Disengaged) → opens fees view per list.
           Populated by: components/aml.js -->
      <div id="section-aml"></div>

      <!-- AML fees view — dedicated page view, scoped to one ClickUp list.
           Lives OUTSIDE .page-content so it can be toggled independently.
           Populated by: components/fees.js -->
      <div id="section-fees"></div>

      <!-- Valuation Tool — dedicated full-page view (auditor report builder).
           Lives OUTSIDE .page-content so it can be toggled independently.
           Populated by: components/pages/valuation.js -->
      <div id="section-valuation"></div>

      <!-- Performance Report — dedicated full-page admin view.
           Employee chargeability card + breakdown + team view.
           Populated by: components/pages/performance.js -->
      <div id="section-performance"></div>

      <!-- Budget KPI — dedicated full-page admin view.
           Manager budget vs invoiced, monthly breakdown, averages.
           Populated by: components/pages/budget-kpi.js -->
      <div id="section-budgetkpi"></div>

      <!-- Financials — board/admin full-page view. Revenue, budget vs actual,
           recoverability, debtors. Populated by: components/pages/financials.js -->
      <div id="section-financials"></div>

      <!-- Company Task Finder — dedicated full-page view.
           Search a company → all its tasks across every ClickUp space.
           Populated by: components/pages/companies.js -->
      <div id="section-companies"></div>

      <!-- CRM landing — dedicated full-page view.
           Card grid to pick a per-list dashboard (Deals / Leads / Accounts).
           Populated by: components/pages/crm.js -->
      <div id="section-crm"></div>

      <!-- CRM list dashboard — generic full-page view for Leads / Accounts.
           Config-driven from the backend registry (GET /api/companies/lists).
           Populated by: components/pages/crm-list.js -->
      <div id="section-crmlist"></div>

      <!-- TB Ratio Tool — dedicated full-page view.
           Upload an E-Soft trial balance → P&L, Balance Sheet & ratios.
           Populated by: components/pages/tbratio.js -->
      <div id="section-tbratio"></div>

      <!-- Forms — dedicated full-page view.
           Lead / Deal forms → create a task in the matching ClickUp list.
           Populated by: components/pages/forms.js -->
      <div id="section-forms"></div>

      <!-- Team Calendar — dedicated full-page view.
           Leave, meetings & deadlines. People as rows, days as columns.
           Populated by: components/pages/team-calendar.js -->
      <div id="section-teamcalendar"></div>

    </main>

  </div><!-- /app-shell -->

  <!-- Single ES module entry point — all logic lives in JS files -->
  <script type="module" src="main.js?v=live5"></script>

</body>
</html>
